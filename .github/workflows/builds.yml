name: Java CI with Gradle

# This workflow is triggered on pushes or pull requests to the 'main' branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment for the job

    steps:
      - name: Checkout code
        # This step checks out the repository code, so it can be built and tested
        uses: actions/checkout@v3

      - name: Set up JDK 21
        # This step sets up Java Development Kit (JDK) version 21 for the environment
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'  # Use the AdoptOpenJDK distribution
          java-version: '21'

      - name: Cache Gradle dependencies
        # Cache Gradle dependencies to speed up subsequent builds
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches  # Path to Gradle cache directory
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Build and Test
        # Run the Gradle build and test commands
        run: ./gradlew build  # Build the project and run all tests

      - name: Upload JAR File
        # Upload the built JAR file as an artifact for later use
        if: success()  # Only run this step if the previous steps succeeded
        uses: actions/upload-artifact@v3
        with:
          name: spelling-trainer-jar
          path: build/libs/*.jar  # Path to the JAR file generated by Gradle
